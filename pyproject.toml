[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joho"
version = "1.0.0"
requires-python = ">=3.10"

dependencies = [
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest_asyncio",
    "mypy",
]

[project.scripts]
joho = "joho.main:main"

[tool.hatch.build.targets.wheel]
packages = ["joho"]

[tool.pytest.ini_options]
markers = [
    "integration: mark test as integration test",
]
asyncio_mode = "auto"

[tool.mypy]
strict = true